    <h1 class="proj-detail-title">南山人壽 FIDO App</h1>
    <div class="proj-meta"><div class="proj-meta-row"><span class="proj-meta-label">時間</span><span class="proj-meta-value">2022年</span></div><div class="proj-meta-row"><span class="proj-meta-label">產業</span><span class="proj-meta-value">保險金融</span></div><div class="proj-meta-row"><span class="proj-meta-label">類別</span><span class="proj-meta-value">體驗流程規劃、介面設計、平面設計</span></div><div class="proj-meta-row"><span class="proj-meta-label">角色</span><span class="proj-meta-value">設計師</span></div></div>
    <p class="proj-detail-desc">設計橫跨平板與手機的 FIDO 投保介面，涵蓋紙本驗證流程說明；在品牌調性的基礎上注入輕鬆年輕化的視覺語言，降低投保心理門檻，讓使用者在數位化流程中也能感受到品牌的溫度。</p>
